name: Run All GVU Agents

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC — adjust to your preferred time
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

jobs:
  run-all-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run every agent found in dated folders
        run: |
          for dir in */; do
            if [ -f "$dir/gvu_speech_agent.py" ]; then
              echo "=== Running $dir ==="
              python "$dir/gvu_speech_agent.py" || echo "!! $dir failed, continuing"
            fi
          done

      - name: Commit any output changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Automated run: $(date -u +%F)"
          git push
